# port
server.port=8081

spring.application.name=ServerDrivenUI-Service

#################################################################################################
#                                   Database Configuration
#################################################################################################
# MSSQL Database Configuration (Internal Docker Network)
spring.datasource.url=jdbc:sqlserver://mssql_db:1433;databaseName=server_driven_ui_db;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# Use application user instead of 'sa' for security
spring.datasource.username=server_driven_ui_user
spring.datasource.password=8fd2SSSvf3fp3tL8p!Bkdd!d8GGh#2j8YjS6L#msPnsmLkt2fKwDs58oP3

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# SQL Initialization - Set to 'never' until you fix data.sql (TRUE -> 1)
# current configuration runs data.sql on every startup and continues even if SQL statements fail. This is useful for development but should be changed for production:
# spring.sql.init.mode=never
# spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-*.sql
spring.sql.init.continue-on-error=false

# Logging
logging.level.org.springframework.jdbc.datasource.init=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.dev.codexo=DEBUG

