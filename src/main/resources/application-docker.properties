# Docker specific configuration
server.port=8080
server.address=0.0.0.0

# Application name
spring.application.name=ServerDrivenUI-Service

# Actuator configuration for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Logging configuration
logging.level.dev.codexo=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# CORS configuration (backup to Traefik)
spring.web.cors.allowed-origins=https://codexo.dev,https://*.codexo.dev
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=Content-Type,Authorization,X-Requested-With
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600