name: CI/CD Deploy (dev / test / production)

on:
  push:
    branches: [dev, test, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build
        run: ./mvnw -B verify -DskipTests


  ###############################
  # DEV DEPLOY
  ###############################
  deploy_dev:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
      SSH_KEY:  ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: /srv/apps/ServerDrivenUI/ServerDrivenUI-Service/dev

    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload DEV compose file
        run: |
          PORT=${SSH_PORT:-22}
          ssh -p "$PORT" "$SSH_USER@$SSH_HOST" "mkdir -p $DEPLOY_PATH"
          rsync -avz -e "ssh -p $PORT" deploy/docker-compose.dev.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Deploy DEV
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "
            cd $DEPLOY_PATH;
            docker compose down --remove-orphans || true;
            docker compose up -d --build;
          "


  ###############################
  # TEST DEPLOY
  ###############################
  deploy_test:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/test'
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
      SSH_KEY:  ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: /srv/apps/ServerDrivenUI/ServerDrivenUI-Service/test

    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload TEST compose file
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "mkdir -p $DEPLOY_PATH"
          rsync -avz -e "ssh -p ${SSH_PORT:-22}" deploy/docker-compose.test.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Deploy TEST
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "
            cd $DEPLOY_PATH;
            docker compose down --remove-orphans || true;
            docker compose up -d --build;
          "


  ###############################
  # PROD DEPLOY
  ###############################
  deploy_prod:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USERNAME }}
      SSH_KEY:  ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      DEPLOY_PATH: /srv/apps/ServerDrivenUI/ServerDrivenUI-Service/prod

    steps:
      - uses: actions/checkout@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.SSH_KEY }}

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload PROD compose file
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "mkdir -p $DEPLOY_PATH"
          rsync -avz -e "ssh -p ${SSH_PORT:-22}" deploy/docker-compose.prod.yml \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/docker-compose.yml"

      - name: Deploy PROD
        run: |
          ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "
            cd $DEPLOY_PATH;
            docker compose down --remove-orphans || true;
            docker compose up -d --build;
          "
