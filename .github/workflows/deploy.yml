name: Deploy to Dev Server

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build and Test
        run: mvn -B clean package

      - name: Build Docker Image
        run: docker build -t serverdrivenui:dev .

      - name: Save Docker Image
        run: docker save serverdrivenui:dev -o ServerDrivenUiServcie-0.0.1-SNAPSHOT.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ServerDrivenUiServcie-0.0.1-SNAPSHOT.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest

    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}
      APP_NAME: ServerDrivenUiServcie-0.0.1-SNAPSHOT.tar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -p ${SSH_PORT:-22} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Files
        run: |
          scp -P ${SSH_PORT:-22} ${APP_NAME} \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

          scp -P ${SSH_PORT:-22} deploy/docker-compose.dev.yml \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      - name: Deploy with Backup
        run: |
          ssh -p ${SSH_PORT:-22} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}

            # Backup current version
            if docker images serverdrivenui:dev -q | grep -q .; then
              echo "Backing up current version..."
              docker tag serverdrivenui:dev serverdrivenui:backup
            fi

            # Load new image
            echo "Loading new docker image..."
            docker load -i ${APP_NAME}

            # Stop old containers
            echo "Stopping old containers..."
            docker compose -f docker-compose.dev.yml down || true

            # Start new containers
            echo "Starting new containers..."
            if docker compose -f docker-compose.dev.yml up -d; then
              echo "Deployment successful!"
              docker image rm serverdrivenui:backup 2>/dev/null || true
            else
              echo "Deployment failed! Rolling back..."
              docker tag serverdrivenui:backup serverdrivenui:dev
              docker compose -f docker-compose.dev.yml up -d
              exit 1
            fi

            # Cleanup
            docker image prune -f
          EOF
