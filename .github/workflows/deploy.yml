# Requires repository secrets:
#   SSH_HOST        - Hostname or IP of the Hostinger Ubuntu server
#   SSH_USERNAME    - SSH user with permissions to deploy and manage Docker
#   SSH_PRIVATE_KEY - Private key matching the server's authorized_keys entry
#   SSH_PORT        - (Optional) SSH port, defaults to 22
#   DEPLOY_PATH     - Directory on the server where the project should livename: Deploy to Dev Server



on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}   # ← ADD HERE

    steps:
      # -------------------------
      # CHECKOUT PROJECT
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # BUILD JAR USING MAVEN
      # -------------------------
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build Spring Boot JAR
        run: mvn -B clean package -DskipTests

      # -------------------------
      # PREPARE SSH
      # -------------------------
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -p ${SSH_PORT:-22} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # -------------------------
      # UPLOAD PROJECT FILES TO SERVER
      # -------------------------
      - name: Upload deployment files
        run: |
          rsync -avz -e "ssh -p ${SSH_PORT:-22}" \
            --exclude='.git' \
            --exclude='target' \
            ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # -------------------------
      # RUN DOCKER COMPOSE ON SERVER
      # -------------------------
      - name: Deploy with Docker Compose
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}
          
            echo "Stopping old containers..."
            docker compose -f deploy/docker-compose.dev.yml down || true
          
            echo "Building new container..."
            docker compose -f deploy/docker-compose.dev.yml build
          
            echo "Starting new version..."
            docker compose -f deploy/docker-compose.dev.yml up -d
          
            echo "Cleaning old images..."
            docker image prune -f
          EOF
