name: Deploy to Dev Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # Build JAR
      - name: Build Spring Boot JAR
        run: mvn -B clean package -DskipTests

      # Build Docker image (Dockerfile is in project root)
      - name: Build Docker Image
        run: docker build -t serverdrivenui:dev .

      # Save Docker image to tar file
      - name: Save Docker Image
        run: docker save serverdrivenui:dev -o serverdrivenui.tar

      # Prepare SSH
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -p ${SSH_PORT:-22} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Upload the image to the server
      - name: Upload Docker Image
        run: |
          scp -P ${SSH_PORT:-22} serverdrivenui.tar \
          ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/serverdrivenui.tar

      # Deploy on server
      - name: Deploy on Server
        run: |
          ssh -p ${SSH_PORT:-22} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.DEPLOY_PATH }}

            echo "Loading docker image..."
            docker load -i serverdrivenui.tar

            echo "Stopping old containers..."
            docker compose -f deploy/docker-compose.dev.yml down || true

            echo "Starting containers..."
            docker compose -f deploy/docker-compose.dev.yml up -d

            echo "Cleaning unused images..."
            docker image prune -f
          EOF
