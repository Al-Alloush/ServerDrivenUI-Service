name: Deploy to Dev Server

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}
      APP_NAME: ServerDrivenUiServcie-0.0.1-SNAPSHOT.tar

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Java
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      # Build Spring Boot JAR
      - name: Build Spring Boot JAR
        run: mvn -B clean package -DskipTests

      # Build Docker image using Dockerfile in repo root
      - name: Build Docker Image
        run: docker build -t serverdrivenui:dev .

      # Save image to a tar file
      - name: Save Docker Image
        run: docker save serverdrivenui:dev -o ${APP_NAME}

      # Enable SSH
      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -p ${SSH_PORT:-22} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # Upload TAR + docker-compose.dev.yml to server DEPLOY_PATH
      - name: Upload Required Files
        run: |
          scp -P ${SSH_PORT:-22} ${APP_NAME} \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

          scp -P ${SSH_PORT:-22} deploy/docker-compose.dev.yml \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/

      # Deploy on Server
      - name: Deploy on Server
        run: |
          ssh -p ${SSH_PORT:-22} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << EOF
            cd ${{ secrets.DEPLOY_PATH }}

            echo "Loading docker image..."
            docker load -i ${APP_NAME}

            echo "Stopping old containers..."
            docker compose -f docker-compose.dev.yml down || true

            echo "Starting new containers..."
            docker compose -f docker-compose.dev.yml up -d

            echo "Cleaning unused images..."
            docker image prune -f
          EOF
