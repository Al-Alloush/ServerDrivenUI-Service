services:
  serverdrivenui:
    image: serverdrivenui:dev
    container_name: serverdrivenui-dev-api
    networks:
      - internal
      - proxy
    environment:
      - SPRING_PROFILES_ACTIVE=dev,docker
      - SERVER_PORT=8080
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics
    labels:
      # Traefik configuration for API access
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      
      # HTTP Router for API (redirect to HTTPS)
      - "traefik.http.routers.serverdrivenui-api-http.rule=Host(`srvdrvnui-dev.codexo.dev`)"
      - "traefik.http.routers.serverdrivenui-api-http.entrypoints=web"
      - "traefik.http.routers.serverdrivenui-api-http.middlewares=https-redirect"

      # HTTPS Router for API
      - "traefik.http.routers.serverdrivenui-api.rule=Host(`srvdrvnui-dev.codexo.dev`)"
      - "traefik.http.routers.serverdrivenui-api.entrypoints=websecure"
      - "traefik.http.routers.serverdrivenui-api.tls.certresolver=letsencrypt"

      # HTTPS redirect middleware
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

      # Service configuration
      - "traefik.http.services.serverdrivenui-api.loadbalancer.server.port=8080"

      # Health check
      - "traefik.http.services.serverdrivenui-api.loadbalancer.healthcheck.path=/health/ping"
      - "traefik.http.services.serverdrivenui-api.loadbalancer.healthcheck.interval=30s"

      # CORS middleware for API access (uncomment if needed) we need to allow codexo.dev domain to access the API.
      #- "traefik.http.middlewares.cors-api.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      #- "traefik.http.middlewares.cors-api.headers.accesscontrolalloworiginlist=https://codexo.dev,https://*.codexo.dev"
      #- "traefik.http.middlewares.cors-api.headers.accesscontrolallowheaders=Content-Type,Authorization,X-Requested-With"
      #- "traefik.http.middlewares.cors-api.headers.accesscontrolallowcredentials=true"
      #- "traefik.http.routers.serverdrivenui-api.middlewares=cors-api"
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    restart: unless-stopped

networks:
  internal:
    external: true
  proxy:
    external: true